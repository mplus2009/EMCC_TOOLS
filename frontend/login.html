<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3c72">
    <title>Login - Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/login_estilos.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>
                <i class="fas fa-graduation-cap"></i>
                Acceso
            </h1>
            <p>Sistema de Gestión Escolar</p>
        </div>

        <!-- Sección de Login con QR -->
        <div class="qr-login-section">
            <button class="btn-qr-login" onclick="window.location.href='pages/escaner_qr.html'">
                <i class="fas fa-qrcode"></i>
                Escanear QR para Iniciar Sesión
            </button>
        </div>

        <div class="qr-divider">
            <span>o ingresa manualmente</span>
        </div>

        <!-- Mensaje de error -->
        <div id="error-message" class="error-message" style="display: none;"></div>

        <!-- Formulario de login manual -->
        <form id="login-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Nombre</label>
                <input type="text" id="nombre" name="nombre" required 
                       placeholder="Ingresa tu nombre" 
                       autocomplete="off">
            </div>

            <div class="form-group">
                <label><i class="fas fa-users"></i> Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required 
                       placeholder="Ingresa tus apellidos" 
                       autocomplete="off">
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Ingresa tu contraseña">
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Cargo</label>
                <select id="cargo" name="cargo" required>
                    <option value="">Selecciona tu cargo</option>
                    <option value="directiva">Directiva</option>
                    <option value="oficial">Oficial</option>
                    <option value="profesor">Profesor</option>
                    <option value="estudiante">Estudiante</option>
                </select>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                <span>Iniciar Sesión</span>
                <i class="fas fa-spinner fa-spin" style="display: none;"></i>
            </button>
        </form>

        <div class="info-note">
            Ingresa con tu nombre, apellidos y contraseña
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
