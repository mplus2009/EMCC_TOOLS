<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Redireccionando...</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .loading-container {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Cargando sistema...</p>
    </div>

    <script>
        // CONFIGURACIÓN - CAMBIA ESTA URL POR LA DE TU BACKEND
        const BACKEND_URL = 'http://tuservidor.com/backend/api';

        async function verificarSesion() {
            try {
                const response = await fetch(`${BACKEND_URL}/check_session.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.logueado === true) {
                    window.location.href = 'pages/dashboard.html';
                } else {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.log('Error al verificar sesión, redirigiendo a login');
                window.location.href = 'login.html';
            }
        }

        // Verificar sesión después de un breve delay
        setTimeout(verificarSesion, 500);
    </script>
</body>
</html>
